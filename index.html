<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predichess</title>
  
  <!-- Web Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Google Fonts: eboshii typography system -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Background preloads -->
  <link rel="preload" href="assets/images/nebula-poster.webp" as="image" type="image/webp">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <!-- Realtime Network Transports: MQTT + WebRTC PeerJS -->
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Fullscreen WebGL Nebula Background from eboshii.dev -->
  <canvas id="nebula-bg"></canvas>
  <script src="assets/js/nebula-bg.js"></script>

  <!-- Sticky Header matching eboshii.dev -->
  <header class="site-header">
    <nav class="header-nav">
      <div class="nav-left">
        <a class="site-title" href="https://eboshii.github.io/" aria-label="eboshii.dev">
          <span class="logo-name">eboshii</span><span class="logo-tld">.dev</span>
        </a>
        <span class="nav-slash">/</span>
        <span class="nav-app-name">predichess</span>
      </div>

      <div class="nav-right">
        <!-- Player Profile Badge (Click to edit display name) -->
        <button id="btn-player-profile" class="player-profile-pill" title="Edit name">
          <span id="header-player-name" class="pill-name">Player</span>
          <svg class="pill-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>

        <a href="https://eboshii.github.io/games/" class="nav-link">games ↗</a>
      </div>
    </nav>
  </header>

  <!-- Main App Root -->
  <div id="app-root">

    <!-- ============================================================
         1. LOBBY SCREEN (Vertical Expandable Menu)
         ============================================================ -->
    <div id="screen-lobby" class="screen active">
      <div class="lobby-container">
        
        <div class="lobby-hero">
          <h1 class="hero-title">PREDICHESS</h1>
        </div>

        <!-- Vertical Menu Accordion -->
        <div class="vertical-menu">

          <!-- Option 1: Online 2P -->
          <div class="menu-section" id="section-online" data-nx-glow="white">
            <button class="menu-btn" type="button" aria-expanded="false">
              <span class="menu-btn-text">Online 2P</span>
            </button>
            <div class="menu-content">
              <div class="menu-inner">
                <button id="btn-create-room" class="btn-primary btn-large">CREATE ROOM</button>

                <div class="menu-divider">
                  <span>OR JOIN WITH CODE</span>
                </div>

                <form id="form-join-code" class="join-code-form" onsubmit="return false;">
                  <div class="code-input-wrapper">
                    <input type="text" id="input-join-code" class="code-input" placeholder="CODE" maxlength="5" autocomplete="off" spellcheck="false">
                    <button id="btn-submit-join" class="btn-secondary" type="submit">JOIN</button>
                  </div>
                  <div id="join-error-msg" class="form-error" style="display: none;"></div>
                </form>
              </div>
            </div>
          </div>

          <!-- Option 2: Local 2P -->
          <div class="menu-section" id="section-local" data-nx-glow="white">
            <button class="menu-btn" type="button" aria-expanded="false">
              <span class="menu-btn-text">Local 2P</span>
            </button>
            <div class="menu-content">
              <div class="menu-inner">
                <button id="btn-start-pass-play" class="btn-primary btn-large">START LOCAL MATCH</button>
              </div>
            </div>
          </div>

          <!-- Option 3: Bot -->
          <div class="menu-section" id="section-bot" data-nx-glow="white">
            <button class="menu-btn" type="button" aria-expanded="false">
              <span class="menu-btn-text">Bot</span>
            </button>
            <div class="menu-content">
              <div class="menu-inner">
                <div class="elo-chips">
                  <button class="elo-chip" data-elo="800">800</button>
                  <button class="elo-chip active" data-elo="1200">1200</button>
                  <button class="elo-chip" data-elo="1600">1600</button>
                  <button class="elo-chip" data-elo="2000">2000</button>
                </div>

                <button id="btn-start-bot" class="btn-primary btn-large" style="margin-top: 14px;">PLAY BOT</button>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- ============================================================
         2. GAME SCREEN (Chess Board & HUD)
         ============================================================ -->
    <div id="screen-game" class="screen">
      <div class="game-layout">
        
        <!-- Left Side: Interactive Chess Board -->
        <div class="game-board-container">
          
          <!-- Opponent Bar -->
          <div class="opponent-bar-top">
            <button id="btn-game-exit" class="btn-back-text" title="Exit to Lobby">← LOBBY</button>
            
            <div class="opp-info-group">
              <div class="player-dot opponent-dot"></div>
              <span id="game-opponent-name" class="opponent-text-name">Opponent</span>
            </div>

            <!-- Active Room Code Badge -->
            <button id="game-room-code-badge" class="room-pill-badge" style="display: none;" title="Copy invite link">
              <span class="badge-tag">ROOM:</span>
              <span id="game-room-code-val" class="badge-code">-----</span>
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>

            <span id="game-opponent-timer" class="game-timer" style="display: none;">--:--</span>
            <button id="btn-game-resign" class="btn-resign-text">RESIGN</button>
          </div>

          <!-- Board Wrapper -->
          <div class="board-wrapper">
            <div id="chess-board-grid" class="chess-board">
              <!-- JS Grid Generation -->
            </div>
            
            <!-- Prediction phase overlay -->
            <div id="prediction-tint-overlay" class="prediction-tint">
              <div class="prediction-tint-content">
                <span class="tint-text">PREDICT MOVE</span>
              </div>
            </div>
            
            <!-- Pawn Promotion Modal -->
            <div id="promotion-dialog" class="promotion-overlay">
              <div class="promotion-box">
                <div class="promo-option" data-promo="QUEEN" id="promo-q"></div>
                <div class="promo-option" data-promo="ROOK" id="promo-r"></div>
                <div class="promo-option" data-promo="BISHOP" id="promo-b"></div>
                <div class="promo-option" data-promo="KNIGHT" id="promo-n"></div>
              </div>
            </div>

            <!-- Pass & Play Transition Screen -->
            <div id="pass-play-dialog" class="pass-play-overlay" style="display: none;">
              <div class="pass-play-card">
                <h3 id="pass-play-title" class="pass-play-title">PASS DEVICE</h3>
                <button id="btn-pass-play-continue" class="btn-primary" style="margin-top: 12px;">CONTINUE</button>
              </div>
            </div>
          </div>

          <!-- My Info Bar -->
          <div class="my-info-bar-bottom">
            <div class="my-info-row">
              <div class="my-name-group">
                <div class="player-dot my-dot"></div>
                <div class="my-name-display" id="game-my-name">You</div>
              </div>
              <span id="game-my-timer" class="game-timer" style="display: none;">--:--</span>
            </div>
            <div class="turn-status-text-display" id="game-turn-banner">WAITING</div>
          </div>

          <!-- Navigation Controls Row -->
          <div class="navigation-controls-row">
            <button id="btn-game-first" class="btn-game-control" title="First Move">⏮</button>
            <button id="btn-game-prev" class="btn-game-control" title="Previous Move">◀</button>
            <button id="btn-game-next" class="btn-game-control" title="Next Move">▶</button>
            <button id="btn-game-last" class="btn-game-live" title="Live Board">LIVE</button>
          </div>

        </div>

        <!-- Right Side: Move Log Card -->
        <aside class="game-log-panel">
          <div class="panel-header-row">
            <div class="move-log-title">MOVES</div>
            <div id="connection-status-dot" class="conn-dot online" title="Connected"></div>
          </div>
          <div id="game-move-log" class="move-log">
            <!-- JS Injections -->
          </div>
        </aside>

      </div>
    </div>

    <!-- ============================================================
         3. MODALS & OVERLAYS
         ============================================================ -->

    <!-- HOST ROOM MODAL -->
    <div id="modal-host-room" class="dialog-overlay">
      <div class="dialog-box host-room-box">
        <h3 class="dialog-title">ROOM CODE</h3>

        <!-- 5-character Invite Code -->
        <div class="invite-code-container">
          <div id="host-room-code-display" class="invite-code-display">-----</div>
        </div>

        <!-- Action Buttons: Copy Code / Copy Link -->
        <div class="invite-actions-row">
          <button id="btn-copy-room-code" class="btn-action-pill">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            COPY CODE
          </button>
          <button id="btn-copy-room-link" class="btn-action-pill">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            COPY LINK
          </button>
        </div>

        <!-- Timer control options -->
        <div class="host-timer-picker">
          <div class="timer-chips">
            <button class="timer-chip" data-timer="blitz_10m">10M</button>
            <button class="timer-chip active" data-timer="rapid_20m">20M</button>
            <button class="timer-chip" data-timer="rapid_30m">30M</button>
            <button class="timer-chip" data-timer="untimed">∞</button>
          </div>
        </div>

        <!-- Waiting indicator -->
        <div class="host-waiting-status">
          <span class="pulsing-amber-dot"></span>
          <span>Waiting for opponent...</span>
        </div>

        <div class="dialog-buttons" style="margin-top: 18px;">
          <button id="btn-cancel-host-room" class="btn-dialog btn-dialog-cancel">CANCEL</button>
        </div>
      </div>
    </div>

    <!-- EDIT DISPLAY NAME MODAL -->
    <div id="modal-edit-name" class="dialog-overlay">
      <div class="dialog-box" style="max-width: 340px;">
        <h4 class="dialog-title">NAME</h4>
        <form id="form-edit-name" onsubmit="return false;" style="margin: 12px 0;">
          <input type="text" id="input-player-name" class="form-input" maxlength="18" placeholder="Name" autocomplete="off">
        </form>
        <div class="dialog-buttons">
          <button id="btn-save-name" class="btn-dialog btn-dialog-confirm">SAVE</button>
          <button id="btn-cancel-name" class="btn-dialog btn-dialog-cancel">CANCEL</button>
        </div>
      </div>
    </div>

    <!-- GLOBAL DYNAMIC ALERT DIALOG (Resignation, Game Over) -->
    <div id="global-dialog" class="dialog-overlay">
      <div class="dialog-box">
        <h4 class="dialog-title" id="dialog-title">Alert</h4>
        <p class="dialog-message" id="dialog-message"></p>
        <div class="dialog-buttons" id="dialog-buttons"></div>
      </div>
    </div>

    <!-- GLOBAL TOAST NOTIFICATIONS -->
    <div class="toast-container">
      <div id="global-toast" class="toast">
        <span id="toast-message"></span>
      </div>
    </div>

  </div>

  <!-- Site Footer matching eboshii.dev -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span>&copy; 2026 eboshii.dev</span>
      <span class="footer-sep">&middot;</span>
      <a href="https://eboshii.dev/stats/" class="footer-stats-link">stats</a>
      <span class="footer-sep">&middot;</span>
      <span class="footer-tip-pair">
        <a href="https://eboshii.dev/tip/" class="footer-stats-link">tip jar</a>
        <span class="footer-slash">/</span>
        <a href="https://eboshii.dev/crypto/" class="footer-stats-link">crypto</a>
      </span>
    </div>
  </footer>

  <!-- Application Script Module -->
  <script type="module" src="app.js"></script>

</body>
</html>
